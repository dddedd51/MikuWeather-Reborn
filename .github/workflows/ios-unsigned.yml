name: Build Miku Weather packages
on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        options: [all, ios, android, windows]
        default: all
        description: Packages to build
  push:
    branches: [main]
    paths: ['src/**', 'shared/**', 'desktop/**', 'ios/**', 'android/**', 'tests/**', 'scripts/**', 'package*.json', '.github/workflows/ios-unsigned.yml']
permissions:
  contents: read
jobs:
  windows:
    if: github.event_name == 'push' || inputs.platform == 'windows' || inputs.platform == 'all'
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test --test-concurrency=1 tests/*.test.mjs
      - run: npm run package:win
      - name: Update through the packaged Settings window and verify the restarted version
        run: node scripts/verify-windows-update.mjs
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: MikuWeather-Reborn-Windows
          path: release/*Windows-*.zip
          if-no-files-found: error
  android:
    if: github.event_name == 'push' || inputs.platform == 'android' || inputs.platform == 'all'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4.0.4
      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: '8.11.1'
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run build && npx cap sync android
      - name: Build and check unsigned Android APK
        run: gradle -p android --no-daemon assembleRelease testReleaseUnitTest lintRelease
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: MikuWeather-Reborn-Android-unsigned
          path: android/app/build/outputs/apk/release/*unsigned.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: Android-check-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore
  ios-widgets:
    if: github.event_name == 'push' || inputs.platform == 'ios' || inputs.platform == 'all'
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Shared application tests
        run: npm test
      - name: Native widget data and cache tests
        run: |
          set -euo pipefail
          mkdir -p work
          swiftc ios/App/SharedWidget/WidgetData.swift tests/ios-widget/main.swift -o work/widget-data-tests
          work/widget-data-tests | tee work/widget-data-tests.log
      - name: Build web application and sync iOS
        run: npm run build && npx cap sync ios
      - name: Compile arm64 application with embedded WidgetKit extension
        run: bash scripts/build-ios.sh
      - name: Simulator private cache and widget layout review
        run: bash scripts/verify-ios-widget-simulator.sh
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: MikuWeather-Reborn-iOS-widgets-unsigned
          path: |
            release/*.ipa
            docs/iOS-WIDGETS.md
            work/ios-widget-package-audit.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: iOS-widget-review
          path: |
            work/*build.log
            work/widget-data-tests.log
            work/widget-previews/*.png
          if-no-files-found: ignore
