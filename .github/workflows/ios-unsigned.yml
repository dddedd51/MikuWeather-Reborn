name: Build unsigned iPhone IPA
on:
  workflow_dispatch:
  push:
    branches: [update/multilingual-ios]
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test
      - run: npm run build
      - run: npx cap sync ios
      - name: Compile unsigned arm64 app and package IPA
        run: bash scripts/build-ios.sh
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: MikuWeather-Reborn-iOS-unsigned
          path: release/*iOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-build-diagnostics
          path: work/ios-build.log
          if-no-files-found: ignore
