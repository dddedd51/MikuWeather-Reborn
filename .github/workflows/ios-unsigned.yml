name: Complete 0.3.6 Windows release in cloud
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows-release:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 5e3f1984d6d941da6eca411423017811825557bf
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run Windows tests
        run: |
          $mikuTest='tests/updater-windows.test.mjs'
          $mikuCode=[IO.File]::ReadAllText($mikuTest)
          $mikuCode=$mikuCode.Replace('assert.equal(exit.code,0,exit.output);','assert.equal(exit.code,0,exit.output + String(await fs.readFile(f.config.log, "utf8").catch(()=> "")));')
          [IO.File]::WriteAllText($mikuTest,$mikuCode,[Text.UTF8Encoding]::new($false))
          & node --test --test-concurrency=1 tests/*.test.mjs
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Build portable Windows package
        run: npm run package:win
      - name: Audit, upload and publish complete release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $mikuScript=Join-Path $env:RUNNER_TEMP 'miku-cloud-release.mjs'
          @'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import {createRequire} from 'node:module';
          const root=process.env.GITHUB_WORKSPACE,slug='dddedd51/MikuWeather-Reborn',head='5e3f1984d6d941da6eca411423017811825557bf';
          const token=process.env.GITHUB_TOKEN;if(!token)throw Error('Missing job token');
          const headers={Authorization:'Bearer '+token,'User-Agent':'MikuWeather-Reborn',Accept:'application/vnd.github+json'};
          async function api(route,method='GET',body){const r=await fetch('https://api.github.com'+route,{method,headers:{...headers,'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body),signal:AbortSignal.timeout(60000)});if(!r.ok)throw Error('GitHub HTTP '+r.status);return r.status===204?null:r.json();}
          const hash=data=>crypto.createHash('sha256').update(data).digest('hex');
          const expected={
           'MikuWeather-Reborn-0.3.6-Android.apk':'950e8c53c344c1d37b8c4b141f315ad908aa252f33bcb0692361cd54d46d298e',
           'MikuWeather-Reborn-0.3.6-iOS-unsigned.ipa':'ebfade3c9b4a1dd017decc3ac177885d5a199f55d77c9fdb4606f112c64e8592',
           'MikuWeather-Reborn-0.3.6-Source.zip':'4f4dc2c069a09d27d293d989d0f787c5c0ac509b6ebceb35e305170bc639a29b'
          };
          let release=await api(`/repos/${slug}/releases/452836798`);
          if(!release.draft||release.tag_name!=='v0.3.6'||release.target_commitish!==head||(await api(`/repos/${slug}/commits/main`)).sha!==head)throw Error('Draft release or main changed');
          let assets=await api(`/repos/${slug}/releases/${release.id}/assets`);
          for(const [name,digest] of Object.entries(expected)){const a=assets.find(a=>a.name===name);if(!a||a.state!=='uploaded'||a.digest!=='sha256:'+digest)throw Error('Existing signed artifact mismatch: '+name);}
          const asar=createRequire(path.join(root,'package.json'))('@electron/asar'),app=path.join(root,'release/win-unpacked/resources/app.asar');
          const pkg=JSON.parse(asar.extractFile(app,'package.json'));if(pkg.version!=='0.3.6')throw Error('Windows version mismatch');
          const entries=asar.listPackage(app);if(entries.some(n=>/(?:private\.json|\.keystore|\.jks|\.p12|\.pem)$|\/secrets\//i.test(n)))throw Error('Private file in app package');
          const service=JSON.parse(asar.extractFile(app,'desktop/service.json'));
          if(service.proxyUrl!=='https://miku-weather-reborn-api.pages.dev'||service.tencent?.proxyUrl!==service.proxyUrl||JSON.stringify(service).includes('secret'))throw Error('Public service configuration mismatch');
          const packageBytes=fs.readFileSync(app);if(packageBytes.includes(Buffer.from(token)))throw Error('Job token included in package');
          const windowsName='MikuWeather-Reborn-0.3.6-Windows-x64.zip',windowsPath=path.join(root,'release',windowsName),windowsBytes=fs.readFileSync(windowsPath),windowsDigest=hash(windowsBytes);
          expected[windowsName]=windowsDigest;
          const oldWindows=assets.find(a=>a.name===windowsName);
          if(oldWindows){if(oldWindows.state==='starter'&&oldWindows.digest==null)await api(`/repos/${slug}/releases/assets/${oldWindows.id}`,'DELETE');else if(oldWindows.digest!=='sha256:'+windowsDigest)throw Error('An existing Windows file differs');}
          async function upload(name,data){const r=await fetch(release.upload_url.split('{')[0]+'?name='+encodeURIComponent(name),{method:'POST',headers:{...headers,'Content-Type':'application/octet-stream'},body:data,signal:AbortSignal.timeout(600000)});if(r.status!==201)throw Error('Upload HTTP '+r.status);const a=await r.json();if(a.digest!=='sha256:'+hash(data)||a.size!==data.length)throw Error('Uploaded hash mismatch');console.log('Uploaded and verified '+name);}
          if(!oldWindows||oldWindows.state==='starter')await upload(windowsName,windowsBytes);
          assets=await api(`/repos/${slug}/releases/${release.id}/assets`);
          const order=[Object.keys(expected)[0],Object.keys(expected)[1],windowsName,Object.keys(expected)[2]];
          const checksumBytes=Buffer.from(order.map(n=>expected[n]+'  '+n+'\n').join(''));
          const oldChecksums=assets.find(a=>a.name==='SHA256SUMS.txt');
          if(oldChecksums&&oldChecksums.digest!=='sha256:'+hash(checksumBytes)){
           if(oldChecksums.digest!=='sha256:8f3332fcce3468925f37c36bf3d98e9d08c105ef5165672973d639b074e860dd')throw Error('Checksum file changed unexpectedly');
           await api(`/repos/${slug}/releases/assets/${oldChecksums.id}`,'DELETE');
          }
          if(!oldChecksums||oldChecksums.digest!=='sha256:'+hash(checksumBytes))await upload('SHA256SUMS.txt',checksumBytes);
          assets=await api(`/repos/${slug}/releases/${release.id}/assets`);
          for(const [name,digest] of Object.entries({...expected,'SHA256SUMS.txt':hash(checksumBytes)})){const a=assets.find(a=>a.name===name);if(!a||a.state!=='uploaded'||a.digest!=='sha256:'+digest)throw Error('Final asset mismatch: '+name);}
          const audit={version:'0.3.6',head,runId:process.env.GITHUB_RUN_ID,windows:{file:windowsName,sha256:windowsDigest,bytes:windowsBytes.length,version:pkg.version,privateFiles:0,jobTokenMatches:0,asarEntries:entries.length},assets:assets.map(a=>({name:a.name,digest:a.digest,size:a.size,url:a.browser_download_url}))};
          fs.mkdirSync(path.join(root,'work'),{recursive:true});fs.writeFileSync(path.join(root,'work/Windows-cloud-audit.json'),JSON.stringify(audit,null,2));
          release=await api(`/repos/${slug}/releases/${release.id}`,'PATCH',{draft:false,make_latest:'true'});
          audit.url=release.html_url;fs.writeFileSync(path.join(root,'work/Windows-cloud-audit.json'),JSON.stringify(audit,null,2));
          console.log(JSON.stringify(audit));
          
          '@ | Set-Content -LiteralPath $mikuScript -Encoding utf8
          & node $mikuScript
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: Windows-cloud-release-audit
          path: work/Windows-cloud-audit.json
          if-no-files-found: ignore
